services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: design-patterns-app
    ports:
      - "42088:42088"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:42088/')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - design-patterns-net

networks:
  design-patterns-net:
    driver: bridge
