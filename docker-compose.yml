services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: design-patterns-app
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
      - DATABASE_URL=sqlite:///instance/patterns.db
    volumes:
      - app-data:/app/instance
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - design-patterns-net

volumes:
  app-data:
    driver: local

networks:
  design-patterns-net:
    driver: bridge
